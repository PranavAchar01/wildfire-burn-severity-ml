[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-burn-severity-ml"
version = "0.1.0"
description = "End-to-end ML pipeline classifying wildfire burn severity from multispectral reflectance (dNBR)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Pranav Achar"}]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.1", "joblib>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
burnseverity = "burnseverity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
